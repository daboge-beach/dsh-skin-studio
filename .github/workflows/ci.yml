name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # prebuild 的 manifest 同步脚本在无 DSH 宿主的环境自动跳过；
      # 全仓构建产出 skins 的 lib/ 产物
      - name: Build
        run: pnpm build

      # 架构门禁：生成数据漂移检查（skin.json tokens / builtinSkins.gen /
      # quotes.json 与源一致）+ client bundle 体积阈值（gzip ≤80KB）
      - name: Generated-data drift & bundle size
        run: |
          node scripts/gen-skin-data.mjs --check
          node --experimental-strip-types scripts/gen-quotes.mjs --check
          node scripts/check-bundle-size.mjs

      # 发布门禁放最后：产物检查需要先 build（lib/index.mjs 等真实入口）
      - name: Validate skins (release gate)
        run: pnpm validate-skins
