name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24：gen-quotes 的 --experimental-strip-types 依赖较新的
          # 类型剥离实现（Node 22 的实验版在部分语法上不兼容）
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 统一验收入口（与本地 pnpm verify 完全同一串）：
      # lint → typecheck → test → skin-data 漂移 → quotes 漂移
      # → build → bundle 体积门禁 → validate-skins
      - name: Verify
        run: pnpm verify
