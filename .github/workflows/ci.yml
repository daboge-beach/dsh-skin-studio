name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24：gen-quotes 的 --experimental-strip-types 依赖较新的
          # 类型剥离实现（Node 22 的实验版在部分语法上不兼容）
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # prebuild 的 manifest 同步脚本在无 DSH 宿主的环境自动跳过；
      # 全仓构建产出 skins 的 lib/ 产物
      - name: Build
        run: pnpm build

      # 架构门禁：生成数据漂移检查 + bundle 体积阈值（分步便于定位失败）
      - name: Drift check (skin data)
        run: node scripts/gen-skin-data.mjs --check

      - name: Drift check (quotes)
        run: node --experimental-strip-types scripts/gen-quotes.mjs --check

      - name: Bundle size gate
        # client.js 仅接线环境产出；CI 回退构建无该产物时脚本自动跳过
        run: node scripts/check-bundle-size.mjs

      # 发布门禁放最后：产物检查需要先 build（lib/index.mjs 等真实入口）
      - name: Validate skins (release gate)
        run: pnpm validate-skins
