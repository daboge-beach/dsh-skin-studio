<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- 慕沛灵 · 花瓣法宝默认态：五瓣粉色半透明花，深粉蕊 -->
  <g transform="translate(16 16)">
    <!-- 花蕊 -->
    <circle r="3.2" fill="#993556" />
    <circle r="3.2" fill="none" stroke="#D4537E" stroke-width="1" />
    <!-- 五片花瓣 -->
    <g fill="#ED93B1" fill-opacity="0.62" stroke="#D4537E" stroke-width="0.6">
      <ellipse cx="0" cy="-8.5" rx="4.1" ry="6.4" />
      <ellipse cx="0" cy="-8.5" rx="4.1" ry="6.4" transform="rotate(72)" />
      <ellipse cx="0" cy="-8.5" rx="4.1" ry="6.4" transform="rotate(144)" />
      <ellipse cx="0" cy="-8.5" rx="4.1" ry="6.4" transform="rotate(216)" />
      <ellipse cx="0" cy="-8.5" rx="4.1" ry="6.4" transform="rotate(288)" />
    </g>
    <!-- 高光 -->
    <circle r="1.4" fill="#FBEAF0" fill-opacity="0.85" />
  </g>
</svg>
