<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- 南宫婉 · 白玉簪默认态：竖置白玉簪，椭圆簪身 + 顶部玉饰 -->
  <g transform="translate(0 2)">
    <!-- 簪身（椭圆长簪） -->
    <rect x="13" y="4" width="6" height="20" rx="3" fill="#FAFAFA" stroke="#B4B2A9" stroke-width="1" />
    <rect x="13.8" y="5" width="1.4" height="18" rx="0.7" fill="#D3D1C7" />
    <!-- 顶部玉饰（小圆） -->
    <circle cx="16" cy="3" r="3.4" fill="#FFFFFF" stroke="#888780" stroke-width="1" />
    <circle cx="15" cy="2" r="1.1" fill="#D3D1C7" />
  </g>
</svg>
