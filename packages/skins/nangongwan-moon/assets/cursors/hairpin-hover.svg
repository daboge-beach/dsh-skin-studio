<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- 南宫婉 · 白玉簪悬停态：金色月华环绕椭圆 + 顶部玉饰泛金光 -->
  <g transform="translate(16 2)">
    <!-- 金色月华光环（虚线椭圆） -->
    <ellipse cx="16" cy="13" rx="11" ry="16" fill="none" stroke="#FBBF24" stroke-width="1.4" stroke-dasharray="2.4 3.2" stroke-linecap="round" opacity="0.85" />
    <!-- 簪身 -->
    <rect x="13" y="4" width="6" height="20" rx="3" fill="#F4F0E6" stroke="#888780" stroke-width="1" />
    <!-- 顶部玉饰泛金光 -->
    <circle cx="16" cy="3" r="3.6" fill="#FDDC7A" stroke="#FBBF24" stroke-width="1.2" />
    <circle cx="15" cy="2" r="1.2" fill="#FFF7DC" />
    <!-- 金色月华光斑 -->
    <path d="M7 13 q4 -2 7 0 M18 13 q4 2 7 0" fill="none" stroke="#FBBF24" stroke-width="1.2" opacity="0.7" />
  </g>
</svg>
