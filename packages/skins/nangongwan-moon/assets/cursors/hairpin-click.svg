<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- 南宫婉 · 白玉簪点击态：玉饰闪现朱雀赤纹 + 红色弧光 -->
  <g transform="translate(0 2)">
    <!-- 朱雀赤弧光 -->
    <path d="M6 18 q10 -6 20 0 M8 23 q8 -5 16 0" fill="none" stroke="#E24B4A" stroke-width="1.6" stroke-linecap="round" opacity="0.85" />
    <!-- 簪身 -->
    <rect x="13" y="4" width="6" height="20" rx="3" fill="#F4F0E6" stroke="#888780" stroke-width="1" />
    <!-- 顶部玉饰 + 朱雀赤纹 -->
    <circle cx="16" cy="3" r="3.6" fill="#F8B4B0" stroke="#E24B4A" stroke-width="1.2" />
    <path d="M13.6 2 l2.4 3.4 l2.4 -3.4" fill="none" stroke="#E24B4A" stroke-width="1.2" stroke-linecap="round" />
    <path d="M15.2 3.4 h1.6" stroke="#E24B4A" stroke-width="1" stroke-linecap="round" />
  </g>
</svg>
