<svg style="filter: saturate(1.35) brightness(1.12)" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- 韩立 · 青竹蜂云剑悬停态：叠加金色雷纹光晕（辟邪神雷） -->
  <g transform="translate(6 0) rotate(-45 11 20)">
    <!-- 金色雷光晕 -->
    <polygon points="6,20  16,20  14.6,0  7.4,0" fill="none" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round" opacity="0.9" />
    <!-- 剑柄 -->
    <rect x="6" y="22" width="10" height="4" rx="1.2" fill="#5F8A3D" />
    <rect x="5" y="19.6" width="12" height="2.6" rx="0.8" fill="#3B6D11" />
    <!-- 剑身（泛金光） -->
    <polygon points="7,18  15,18  13.4,2  8.6,2" fill="#97C459" />
    <polygon points="10.2,18  11.9,18  12.2,2  9.8,2" fill="#FBBF24" fill-opacity="0.5" />
    <polygon points="8.6,2  13.4,2  11,0.6" fill="#FBBF24" />
    <!-- 雷电锯齿纹 -->
    <polyline points="9.4,14  10.8,12  9.6,9.5  11.2,7" fill="none" stroke="#FBBF24" stroke-width="1" stroke-linecap="round" />
  </g>
</svg>
