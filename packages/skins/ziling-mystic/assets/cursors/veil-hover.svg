<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- 紫灵 · 紫纱面饰悬停态：流转紫霞光圈 + 白色星点 -->
  <g transform="translate(15 16)">
    <!-- 紫霞光圈 -->
    <circle r="13" fill="none" stroke="#AFA9EC" stroke-width="1.2" stroke-dasharray="2.6 3.4" stroke-linecap="round" />
    <circle r="9.5" fill="none" stroke="#7F77DD" stroke-width="0.8" stroke-dasharray="1.6 2.4" stroke-linecap="round" opacity="0.7" />
    <!-- 白色星点 -->
    <g fill="#FFFFFF" fill-opacity="0.9">
      <circle cx="-9" cy="-10" r="1" />
      <circle cx="9" cy="-9" r="1.1" />
      <circle cx="11" cy="8" r="0.8" />
      <circle cx="-11" cy="6" r="0.9" />
      <circle cx="3" cy="-12" r="0.7" />
    </g>
    <!-- 面纱（加深） -->
    <path d="M0 -13 C 6 -6, 9.5 2, 6.5 9 C 4.4 14, -4.4 14, -6.5 9 C -9.5 2, -6 -6, 0 -13 Z" fill="#AFA9EC" fill-opacity="0.6" stroke="#7F77DD" stroke-width="1.4" />
    <circle cx="-1" cy="5" r="0.9" fill="#FFFFFF" fill-opacity="0.85" />
  </g>
</svg>
