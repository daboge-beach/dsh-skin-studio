    <!-- 纱上暗纹 -->
    <path d="M -4 2 C -2 6, 2 6, 4 3" fill="none" stroke="#7F77DD" stroke-width="1" opacity="0.7" />
    <circle cx="-1" cy="5" r="0.9" fill="#7F77DD" fill-opacity="0.8" />
    <circle cx="1.6" cy="6.6" r="0.8" fill="#7F77DD" fill-opacity="0.8" />
  </g>
</svg>
