<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- 银月 · 月牙法器点击态：月光从月牙向下迸射三道银白光柱 -->
  <g transform="translate(16 15)">
    <!-- 三道银色光柱 -->
    <g fill="url(#beam)">
      <polygon points="-4,5 -1,21 -5,21" />
      <polygon points="0.5,5 -0.2,24 -2.6,24" />
      <polygon points="4,5 5,21 2.5,21" />
    </g>
    <defs>
      <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
        <stop offset="100%" stop-color="#85B7EB" stop-opacity="0.15"/>
      </linearGradient>
    </defs>
    <!-- 月牙 -->
    <mask id="m3">
      <rect x="-16" y="-16" width="32" height="32" fill="white" />
      <circle cx="3.4" cy="0" r="7.2" fill="black" />
    </mask>
    <circle cx="0" cy="0" r="7.2" fill="#DDEBFA" stroke="#85B7EB" stroke-width="1.4" mask="url(#m3)" />
    <circle cx="3.4" cy="0" r="7.2" fill="none" stroke="#85B7EB" stroke-width="1.2" />
  </g>
</svg>
